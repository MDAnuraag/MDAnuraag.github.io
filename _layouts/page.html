---
layout: default
---

<article class="doc">
  <header class="doc-head">
    <h1><span class="p">$ </span>{{ page.title | downcase | replace: ' ', '-' }}</h1>
    {%- if page.lede %}
    <p class="lede">{{ page.lede }}</p>
    {%- endif %}
  </header>

  <div class="doc-body">
    {{ content }}
  </div>
</article>
