title: Under Constraints
description: notes on conservative modeling and physical inference
author: Anuraag Sharma

baseurl: ""
url: "https://mdanuraag.github.io"

theme: minima

plugins:
  - jekyll-feed
  - jekyll-redirect-from

collections:
  notes:
    output: true
    permalink: /notes/:name/

markdown: kramdown

exclude:
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules
  - scripts
  - README.md
