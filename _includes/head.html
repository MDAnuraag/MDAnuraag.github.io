<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  {%- if page.url == '/' %}
  <title>{{ site.author }}, {{ site.title }}</title>
  {%- else %}
  <title>{{ page.title | default: site.title }} - {{ site.title }}</title>
  {%- endif %}
  <meta name="description" content="{{ page.description | default: page.lede | default: site.description | strip_html | escape }}">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' fill='%23181818'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  {% include katex.html %}
  {%- if page.layout == 'interactive' %}
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" defer></script>
  {%- endif %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
